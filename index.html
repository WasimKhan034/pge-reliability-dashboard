<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Static Reports to Self-Service Reliability Insight · Wasim Khan</title>
<meta name="description" content="A STAR walkthrough of the self-serve outage reliability dashboard I built as a Business Analytics Intern at PG&E.">
<meta property="og:title" content="From Static Reports to Self-Service Reliability Insight">
<meta property="og:description" content="A STAR walkthrough of a self-serve outage reliability dashboard built at PG&E.">
<meta property="og:image" content="slides/s-01.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --navy:#16213D; --ink:#0E1628; --amber:#E8A83E; --cream:#F6F4EF; --muted:#9AA6C2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--ink); color:var(--cream); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px; border-bottom:1px solid rgba(255,255,255,.08); }
  .title { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .title small { color:var(--amber); font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:600; }
  .title span { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn { display:inline-flex; align-items:center; gap:8px; background:var(--amber); color:var(--ink); text-decoration:none; font-weight:600; font-size:14px; padding:9px 16px; border-radius:6px; border:0; cursor:pointer; white-space:nowrap; }
  .btn:hover { filter:brightness(1.08); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; min-height:0; position:relative; }
  .stage { width:min(100%, calc((100vh - 150px) * 16 / 9)); aspect-ratio:16/9; position:relative; }
  .stage img { width:100%; height:100%; object-fit:contain; display:block; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.45); background:var(--navy); }
  .nav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:0; background:rgba(246,244,239,.12); color:var(--cream); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .nav:hover:not(:disabled) { background:rgba(246,244,239,.25); }
  .nav:disabled { opacity:.25; cursor:default; }
  .prev { left:8px; } .next { right:8px; }
  footer { display:flex; align-items:center; justify-content:center; gap:16px; padding:10px 24px 18px; color:var(--muted); font-size:13px; }
  .bar { width:min(420px, 50vw); height:3px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--amber); transition:width .2s; }
  @media (max-width:640px) {
    header { padding:12px 14px; } .btn { padding:8px 12px; font-size:13px; }
    main { padding:10px; } .nav { width:36px; height:36px; font-size:18px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <small>Wasim Khan · Business Analyst Presentation</small>
    <span>From static reports to self-service reliability insight</span>
  </div>
  <a class="btn" href="pge-reliability-dashboard.pdf" download>Download PDF</a>
</header>
<main>
  <div class="stage">
    <img id="slide" src="slides/s-01.jpg" alt="Slide 1">
    <button class="nav prev" id="prev" aria-label="Previous slide">&#8249;</button>
    <button class="nav next" id="next" aria-label="Next slide">&#8250;</button>
  </div>
</main>
<footer>
  <span id="count">1 / 10</span>
  <div class="bar"><i id="progress"></i></div>
  <span>Use ← → keys or swipe</span>
</footer>
<script>
  const TOTAL = 10;
  const img = document.getElementById('slide');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const count = document.getElementById('count');
  const progress = document.getElementById('progress');
  const src = n => `slides/s-${String(n).padStart(2, '0')}.jpg`;
  let i = Math.min(Math.max(parseInt(location.hash.slice(1)) || 1, 1), TOTAL);

  function show(n) {
    i = Math.min(Math.max(n, 1), TOTAL);
    img.src = src(i);
    img.alt = `Slide ${i}`;
    count.textContent = `${i} / ${TOTAL}`;
    progress.style.width = `${(i / TOTAL) * 100}%`;
    prev.disabled = i === 1;
    next.disabled = i === TOTAL;
    history.replaceState(null, '', `#${i}`);
    if (i < TOTAL) new Image().src = src(i + 1);
  }

  prev.onclick = () => show(i - 1);
  next.onclick = () => show(i + 1);
  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(i + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(i - 1); }
    if (e.key === 'Home') show(1);
    if (e.key === 'End') show(TOTAL);
  });
  let x0 = null;
  img.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  img.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  });
  show(i);
</script>
</body>
</html>
